name: Docs sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/**"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head=$(git rev-parse HEAD)
          base=$(cat docs/.last-sync 2>/dev/null || true)
          # Fall back to the pushed range when the recorded commit is missing
          # or no longer an ancestor, for example after a history rewrite.
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$head" 2>/dev/null; then
            base=${PUSH_BEFORE:-}
            if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$head" 2>/dev/null; then
              base=$(git rev-parse "$head~1")
            fi
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "short=$(git rev-parse --short "$head")"
          } >> "$GITHUB_OUTPUT"
          git log --oneline "$base..$head"

      # claude-code-action rejects push events, so run the CLI directly. It
      # authenticates with the subscription OAuth token from the environment.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.296

      - name: Update documentation
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RANGE: ${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}
        run: |
          claude --print \
            --permission-mode dontAsk \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git rev-parse:*)" \
            --output-format text \
            "Follow the instructions in .github/docs-sync-prompt.md. The commit range to document is $RANGE."

      - name: Record synced commit
        run: echo "${{ steps.range.outputs.head }}" > docs/.last-sync

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: docs/sync
          add-paths: docs/**
          commit-message: "docs: sync with ${{ steps.range.outputs.short }}"
          title: "docs: sync with ${{ steps.range.outputs.short }}"
          body: |
            Documentation updates generated by Claude Code for
            `${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}`.

            Review the prose against the source before merging. Merging
            publishes the site and advances `docs/.last-sync`.
          delete-branch: true
