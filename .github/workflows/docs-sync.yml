name: Docs sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/**"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head=$(git rev-parse HEAD)
          base=$(cat docs/.last-sync 2>/dev/null || true)
          # Fall back to the pushed range when the recorded commit is missing
          # or no longer an ancestor, for example after a history rewrite.
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$head" 2>/dev/null; then
            base=${PUSH_BEFORE:-}
            if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$head" 2>/dev/null; then
              base=$(git rev-parse "$head~1")
            fi
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "short=$(git rev-parse --short "$head")"
          } >> "$GITHUB_OUTPUT"
          git log --oneline "$base..$head"

      - name: Update documentation
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow the instructions in .github/docs-sync-prompt.md.

            The commit range to document is
            ${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}.
            When you are done, write ${{ steps.range.outputs.head }} followed
            by a newline to docs/.last-sync.
          claude_args: >-
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git rev-parse:*)"

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: docs/sync
          add-paths: docs/**
          commit-message: "docs: sync with ${{ steps.range.outputs.short }}"
          title: "docs: sync with ${{ steps.range.outputs.short }}"
          body: |
            Documentation updates generated by Claude Code for
            `${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}`.

            Review the prose against the source before merging. Merging
            publishes the site and advances `docs/.last-sync`.
          delete-branch: true
